name: Release

on:
  push:
    tags: ["v*"]
  # Build the zip without publishing, so the package can be tested before a tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check that the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($tag -ne $version) {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          # 0.9.1 is the last release that emits clarified LicenseRef texts;
          # 0.9.2 and 0.9.3 drop them (EmbarkStudios/cargo-about#329).
          tool: cargo-about@0.9.1

      - name: Generate license notices
        run: cargo about generate --locked --config .github/about.toml --output-file third-party-licenses.txt .github/about.hbs

      - name: Check the license notices
        shell: pwsh
        run: |
          $text = Get-Content third-party-licenses.txt -Raw
          foreach ($license in @("GNU AFFERO GENERAL PUBLIC LICENSE", "UBUNTU FONT LICENCE")) {
            if (-not $text.Contains($license)) {
              throw "third-party-licenses.txt is missing: $license"
            }
          }

      - name: Smoke-test the programs
        shell: pwsh
        run: |
          .\target\release\cvsdesk.exe --version
          .\target\release\cvs.exe --version

      - name: Package
        shell: pwsh
        run: |
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $name = "cvsdesk-v$version-windows-x64"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force $stage | Out-Null

          Copy-Item -Path target/release/cvsdesk.exe, target/release/cvs.exe -Destination $stage
          Copy-Item -Path README.md, LICENSE, third-party-licenses.txt -Destination $stage
          if (Test-Path CHANGELOG.md) { Copy-Item -Path CHANGELOG.md -Destination $stage }

          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip" -Force

          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content dist/SHA256SUMS.txt
          Get-ChildItem dist
          Get-Content dist/SHA256SUMS.txt

      - name: Keep the release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist

          extra=()
          if [[ "$TAG" == *-* ]]; then
            extra+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "CVS Desk $TAG" \
              --generate-notes \
              --verify-tag \
              "${extra[@]}"
          fi
